name: Auto Changelog

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      from_tag:
        description: 'Generate changelog from this tag'
        required: false
        type: string
      to_tag:
        description: 'Generate changelog to this tag (default: HEAD)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  generate-changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
      has_changes: ${{ steps.check_changes.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check for changes
        id: check_changes
        run: |
          if [[ "${{ github.event.inputs.from_tag }}" != "" ]]; then
            FROM_TAG="${{ github.event.inputs.from_tag }}"
          else
            FROM_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          fi

          if [[ "${{ github.event.inputs.to_tag }}" != "" ]]; then
            TO_TAG="${{ github.event.inputs.to_tag }}"
          else
            TO_TAG="HEAD"
          fi

          LOG=$(git log --pretty=format:"- %s (%an)" $FROM_TAG..$TO_TAG 2>/dev/null || echo "")

          if [[ -z "$LOG" ]]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "changelog=No changes" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "$LOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Update CHANGELOG.md
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          CHANGELOG="${{ steps.check_changes.outputs.changelog }}"
          DATE=$(date -u +%Y-%m-%d)
          VERSION="${GITHUB_REF_NAME}"

          # Create or update CHANGELOG.md
          if [ -f "CHANGELOG.md" ]; then
            # Prepend to existing changelog
            EXISTING=$(cat CHANGELOG.md)
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "## [Unreleased]" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "${{ steps.check_changes.outputs.changelog }}" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "$EXISTING" >> CHANGELOG.md
          else
            # Create new changelog
            cat > CHANGELOG.md << 'EOF'
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

## [Unreleased]

EOF
            echo "${{ steps.check_changes.outputs.changelog }}" >> CHANGELOG.md
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): update changelog [skip ci]" || echo "No changes to commit"
          git push || echo "No changes to push"

  create-release-pr:
    name: Create Release PR
    needs: generate-changelog
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.generate-changelog.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release Branch
        run: |
          BRANCH="release/auto-$(date +%Y%m%d-%H%M%S)"
          git checkout -b $BRANCH
          git push origin $BRANCH

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: release/auto-$(date +%Y%m%d-%H%M%S)
          base: main
          title: "chore: automated release preparation"
          body: |
            Automated release preparation PR.
            
            ## Changes
            ${{ needs.generate-changelog.outputs.changelog }}
            
            This PR was created automatically by the Auto Changelog workflow.
          labels: |
            automated
            release
          assignees: |
            rodrigomatossilva07-rgb

  update-changelog-file:
    name: Update CHANGELOG.md in Repository
    needs: generate-changelog
    if: needs.generate-changelog.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Already committed in generate-changelog step
          echo "CHANGELOG.md updated"

  notify:
    name: Notify
    needs: [generate-changelog, create-release-pr]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        if: secrets.DISCORD_WEBHOOK_URL != ''
        run: |
          STATUS="${{ needs.generate-changelog.result }}"
          CHANGES="${{ needs.generate-changelog.outputs.has_changes }}"
          
          if [[ "$STATUS" == "success" && "$CHANGES" == "true" ]]; then
            COLOR=3066993
            TITLE="📝 Changelog Updated"
            DESC="Automated changelog generated and PR created"
          else
            COLOR=15158332
            TITLE="⚠️ Changelog Generation Issue"
            DESC="Changelog generation completed with status: $STATUS"
          fi
          
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"$TITLE\",
                \"description\": \"$DESC\",
                \"color\": $COLOR,
                \"fields\": [
                  {\"name\": \"Branch\", \"value\": \"${{ github.ref_name }}\", \"inline\": true},
                  {\"name\": \"Commit\", \"value\": \"${{ github.sha }}\", \"inline\": true},
                  {\"name\": \"Run\", \"value\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"inline\": false}
                ],
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }"