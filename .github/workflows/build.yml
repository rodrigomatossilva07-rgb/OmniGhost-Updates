name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ env.VCPKG_ROOT }}'
          vcpkgTriplet: '${{ env.VCPKG_DEFAULT_TRIPLET }}'
          vcpkgArguments: 'leechcore vmm'  # DMA dependencies

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Build Release x64
        run: |
          msbuild OmniGhost.Bootstrap.vcxproj /p:Configuration=Release /p:Platform=x64 /v:m /m

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OmniGhost-Release-x64
          path: |
            build/OmniGhost.exe
            .cache/symbols/bootstrap/Release/OmniGhost.pdb
          retention-days: 7

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/OmniGhost.exe
          generate_release_notes: true

  cleanup:
    needs: build
    if: always()
    runs-on: windows-latest
    steps:
      - name: Cleanup build directories
        run: |
          Remove-Item -Recurse -Force .cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force artifacts -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force x64 -ErrorAction SilentlyContinue
          git clean -fd
        shell: pwsh

      - name: Verify workspace clean
        run: |
          git status --porcelain
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Workspace not clean after cleanup"
          }
        shell: pwsh