name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.3.5)'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: false
        type: choice
        options:
          - stable
          - beta
          - alpha
        default: 'stable'

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows-static-md

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      tag: ${{ steps.extract_version.outputs.tag }}
      changelog: ${{ steps.generate_changelog.outputs.changelog }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Extract Version
        id: extract_version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}" -ne "") {
            $version = "${{ github.event.inputs.version }}"
            $tag = "v$version"
          } else {
            $tag = "${{ github.ref_name }}"
            $version = $tag.TrimStart('v')
          }
          Write-Output "version=$version"
          Write-Output "tag=$tag"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Generate Changelog
        id: generate_changelog
        shell: pwsh
        run: |
          $tag = "${{ steps.extract_version.outputs.tag }}"
          $prevTag = git describe --tags --abbrev=0 $tag^ 2>$null || git rev-list --max-parents=0 HEAD
          $log = git log --pretty=format:"- %s (%an)" $prevTag..$tag
          $changelog = "## $tag`n`n$log"
          echo "changelog<<EOF" >> $env:GITHUB_OUTPUT
          echo "$changelog" >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      - name: Update Version Files
        shell: pwsh
        run: |
          $version = "${{ steps.extract_version.outputs.version }}"
          $tag = "${{ steps.extract_version.outputs.tag }}"

          # Update versions.json
          $versionsPath = "src/project/config/release/versions.json"
          $versions = gc $versionsPath -Raw -Enc UTF8 | ConvertFrom-Json
          $versions.version = $version
          $versions.tag = $tag
          $versions.released_at = (Get-Date).ToUniversalTime().ToString("o")
          $versions | ConvertTo-Json -Depth 5 | Set-Content $versionsPath -Enc UTF8

          # Update vcpkg.json version
          $vcpkgPath = "vcpkg.json"
          if (Test-Path $vcpkgPath) {
            $vcpkg = gc $vcpkgPath -Raw -Enc UTF8 | ConvertFrom-Json
            $vcpkg.version = $version
            $vcpkg | ConvertTo-Json -Depth 5 | Set-Content $vcpkgPath -Enc UTF8
          }

          Write-Host "Updated version to $version ($tag)"

      - name: Commit Version Bump
        if: github.event.inputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/project/config/release/versions.json vcpkg.json
          git commit -m "chore(release): bump version to ${{ steps.extract_version.outputs.version }} [skip ci]"
          git push

  build-publish:
    name: Build Publish Binary
    runs-on: windows-latest
    timeout-minutes: 60
    needs: prepare-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgTriplet: ${{ env.VCPKG_DEFAULT_TRIPLET }}
          vcpkgArguments: nlohmann-json fmt spdlog imgui glfw3

      - name: Configure CMake (Publish)
        run: |
          cmake --preset windows-publish

      - name: Build Publish
        run: |
          cmake --build --preset build-publish --parallel 4

      - name: Validate Publish Build
        run: |
          ctest --preset test-release --output-on-failure

      - name: Verify Reproducible Build
        shell: pwsh
        run: |
          ./src/project/tools/Verify-ReproducibleBuild.ps1 `
            -ProjectDir "." `
            -PrimaryExecutable "build/Publish/OmniGhost.exe"

      - name: Upload Publish Binary
        uses: actions/upload-artifact@v4
        with:
          name: OmniGhost-Publish-${{ needs.prepare-release.outputs.version }}
          path: build/Publish/OmniGhost.exe
          retention-days: 90

      - name: Generate SHA256
        shell: pwsh
        run: |
          $exe = "build/Publish/OmniGhost.exe"
          $hash = Get-FileHash -Algorithm SHA256 -Path $exe
          echo "sha256=$($hash.Hash.ToLower())" >> $env:GITHUB_OUTPUT
          echo "sha256=$($hash.Hash.ToLower())" > sha256.txt

  create-release:
    name: Create GitHub Release
    runs-on: windows-latest
    timeout-minutes: 15
    needs: [prepare-release, build-publish]
    steps:
      - name: Download Publish Binary
        uses: actions/download-artifact@v4
        with:
          name: OmniGhost-Publish-${{ needs.prepare-release.outputs.version }}
          path: release/

      - name: Download SHA256
        uses: actions/download-artifact@v4
        with:
          name: OmniGhost-Publish-${{ needs.prepare-release.outputs.version }}
          path: release/
          pattern: sha256.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: OmniGhost ${{ needs.prepare-release.outputs.version }}
          body: ${{ needs.prepare-release.outputs.changelog }}
          files: |
            release/OmniGhost.exe
            release/sha256.txt
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: false

      - name: Update Latest Release Tag
        if: github.ref == 'refs/tags/v*' && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha')
        run: |
          git tag -f latest ${{ needs.prepare-release.outputs.tag }}
          git push -f origin latest

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [prepare-release, build-publish, create-release]
    if: always()
    steps:
      - name: Send Discord Notification
        if: needs.create-release.result == 'success'
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "🎉 OmniGhost ${{ needs.prepare-release.outputs.version }} Released!",
                "description": "New version published to GitHub Releases",
                "color": 3066993,
                "fields": [
                  {"name": "Version", "value": "${{ needs.prepare-release.outputs.version }}", "inline": true},
                  {"name": "Channel", "value": "${{ github.event.inputs.channel || 'stable' }}", "inline": true},
                  {"name": "Download", "value": "https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare-release.outputs.tag }}", "inline": false}
                ],
                "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
              }]
            }'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Notify Failure
        if: needs.create-release.result == 'failure'
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "❌ Release Failed",
                "description": "OmniGhost ${{ needs.prepare-release.outputs.version }} release pipeline failed",
                "color": 15158332,
                "fields": [
                  {"name": "Version", "value": "${{ needs.prepare-release.outputs.version }}", "inline": true},
                  {"name": "Run", "value": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}", "inline": true}
                ],
                "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
              }]
            }'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}