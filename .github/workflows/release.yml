name: Build, test and release OmniGhost

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omnighost-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_REPOSITORY: rodrigomatossilva07-rgb/OmniGhost-Updates
  RELEASE_TARGET_BRANCH: main

jobs:
  build_test_package:
    name: Build, test and validate
    runs-on: [self-hosted, windows, dma, signing]
    timeout-minutes: 75
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Validate version and tag
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath config/release/version.txt -Raw).Trim()
          if ($version -notmatch '^(0|[1-9]\d*)\.[0-9]\.[0-9]$') {
            throw "Invalid OmniGhost version '$version'. MINOR and PATCH must be 0..9."
          }
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -cne "v$version") {
            throw "Tag '${{ github.ref_name }}' does not match config/release/version.txt (v$version)."
          }
          if (git status --porcelain --untracked-files=normal) {
            throw 'Checkout is not clean before the release build.'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Validate project and release policy
        shell: pwsh
        run: |
          ./tools/Validate-Project.ps1 -ProjectDir .
          ./tools/Test-ReleaseEngineering.ps1 -ProjectDir .
          ./tools/Audit-UiLocalization.ps1 -ProjectDir . -ReportPath artifacts/validation/localization.json
          ./tools/Audit-SourceComplexity.ps1 -ProjectDir .

      - name: Test release source and FiveM offset metadata
        shell: pwsh
        run: ./tools/Test-ReleaseReadiness.ps1 -ProjectDir .

      - name: Stress deterministic resource generators
        shell: pwsh
        run: |
          ./tools/Test-GeneratedResourceConcurrency.ps1 -ProjectDir .

      - name: Verify Release and Publish build profiles
        shell: pwsh
        run: |
          ./tools/Verify-BuildMatrix.ps1 -ProjectDir . -Platform x64

      - name: Analyse release diff semantically
        shell: pwsh
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_CHANGELOG_MODEL: ${{ vars.OPENAI_CHANGELOG_MODEL }}
        run: |
          ./tools/Analyze-ChangelogDiff.ps1 `
            -ProjectDir . `
            -Version '${{ steps.version.outputs.version }}' `
            -OutputPath ./artifacts/semantic-analysis.json

      - name: Build local Release binary and inspect PE
        shell: pwsh
        run: |
          msbuild OmniGhost.Bootstrap.vcxproj /m `
            /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145
          ./tools/Validate-PeRuntime.ps1 `
            -Executable ./build/OmniGhost.exe `
            -OutputDirectory ./artifacts/validation/pe-release `
            -RequireSingleExeDirectory -RequireSelfContainedHost
          ./tools/Validate-EmbeddedOffsets.ps1 `
            -ProjectDir . `
            -Executable ./.cache/bootstrap/payload/x64/Release/OmniGhostCore.exe `
            -Configuration Release -Platform x64

      - name: Build customer binary
        shell: pwsh
        run: |
          msbuild OmniGhost.Bootstrap.vcxproj /m `
            /p:Configuration=Publish /p:Platform=x64 /p:PlatformToolset=v145 `
            /p:OmniGhostSkipPackaging=true /p:OmniGhostSkipRemotePublish=true
          ./tools/Validate-PeRuntime.ps1 `
            -Executable ./build/Publish/OmniGhost.exe `
            -OutputDirectory ./artifacts/validation/pe-publish `
            -RequireSingleExeDirectory -RequireSelfContainedHost
          ./tools/Validate-EmbeddedOffsets.ps1 `
            -ProjectDir . `
            -Executable ./.cache/bootstrap/payload/x64/Publish/OmniGhostCore.exe `
            -Configuration Publish -Platform x64

      - name: Run MSVC static analysis
        shell: pwsh
        run: |
          msbuild OmiGhost.vcxproj /m `
            /p:Configuration=Publish /p:Platform=x64 /p:PlatformToolset=v145 `
            /p:OmniGhostSkipPackaging=true /p:OmniGhostSkipRemotePublish=true /p:RunCodeAnalysis=true `
            /p:CodeAnalysisTreatWarningsAsErrors=false

      - name: Package, generate SBOM and audit dependencies
        shell: pwsh
        run: |
          ./tools/Package-Release.ps1 `
            -ProjectDir . `
            -BuildDir ./build/Publish `
            -Mode Commercial `
            -SemanticAnalysisPath ./artifacts/semantic-analysis.json

      - name: Validate commercial signatures
        shell: pwsh
        run: |
          ./tools/Validate-CommercialRelease.ps1 `
            -ProjectDir . `
            -ReleaseDirectory ./artifacts/release `
            -Version '${{ steps.version.outputs.version }}'

      - name: Validate final release assets
        shell: pwsh
        run: |
          ./tools/Validate-ReleaseArtifacts.ps1 `
            -ProjectDir . `
            -ReleaseDirectory ./artifacts/release `
            -Version '${{ steps.version.outputs.version }}'

      - name: Upload validated release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omnighost-release-${{ steps.version.outputs.version }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/release/OmniGhost.zip
            artifacts/release/update.json
            artifacts/release/update.json.sig
            artifacts/release/install-manifest.sha256
            artifacts/release/SBOM.cdx.json
            artifacts/release/changelog.json
            artifacts/release/release-notes.md
            artifacts/release/release-meta.json

      - name: Upload private symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-symbols-${{ steps.version.outputs.version }}
          if-no-files-found: error
          retention-days: 90
          path: |
            .cache/symbols/Publish/OmniGhostCore.pdb
            .cache/symbols/bootstrap/Publish/OmniGhost.pdb

      - name: Upload engineering validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engineering-validation-${{ steps.version.outputs.version }}
          if-no-files-found: warn
          retention-days: 30
          path: artifacts/validation

  hardware_integration_test:
    name: DMA test of signed customer package
    needs: build_test_package
    runs-on: [self-hosted, windows, dma, signing]
    timeout-minutes: 30
    env:
      OMNIGHOST_TEST_GAME: ${{ vars.OMNIGHOST_TEST_GAME }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Require hardware test configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OMNIGHOST_TEST_GAME)) {
            throw 'OMNIGHOST_TEST_GAME must name a running FiveM_b<build>_GTAProcess.exe on the DMA runner.'
          }

      - name: Download signed customer package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: omnighost-release-${{ needs.build_test_package.outputs.version }}
          path: artifacts/release

      - name: Validate signed customer package
        shell: pwsh
        run: |
          ./tools/Validate-ReleaseArtifacts.ps1 -ProjectDir . -ReleaseDirectory ./artifacts/release `
            -Version '${{ needs.build_test_package.outputs.version }}'
          ./tools/Validate-CommercialRelease.ps1 -ProjectDir . -ReleaseDirectory ./artifacts/release `
            -Version '${{ needs.build_test_package.outputs.version }}'

      - name: Run single-process single-HWND integration test
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP ('omnighost-dma-' + [guid]::NewGuid().ToString('N'))
          Expand-Archive -LiteralPath ./artifacts/release/OmniGhost.zip -DestinationPath $testDir
          $exe = Join-Path $testDir 'OmniGhost.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Signed customer executable missing from ZIP.' }

          $name = [IO.Path]::GetFileNameWithoutExtension($env:OMNIGHOST_TEST_GAME)
          if ($name -notmatch '^FiveM_b[0-9]+_GTAProcess$') { throw 'Expected a FiveM build process name.' }
          $gameProcess = Get-Process -Name $name -ErrorAction SilentlyContinue |
            Where-Object { $_.MainWindowHandle -ne [IntPtr]::Zero } | Select-Object -First 1
          if (-not $gameProcess) { throw "Running FiveM process with HWND not found: $name" }
          $hwndValue = [uint64]$gameProcess.MainWindowHandle.ToInt64()
          & $exe --integration-test `
            --target-exe "$name.exe" `
            --target-pid $gameProcess.Id `
            --target-hwnd "$hwndValue"
          if ($LASTEXITCODE -ne 0) { throw "DMA integration test failed with exit code $LASTEXITCODE" }
          Write-Host '[Integration] DMA reads of FiveM process and CPed visibility flag passed.'

  publish:
    name: Publish approved tag
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build_test_package, hardware_integration_test]
    runs-on: [self-hosted, windows, dma, signing]
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Download validated assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: omnighost-release-${{ needs.build_test_package.outputs.version }}
          path: artifacts/release

      - name: Resolve and revalidate release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath config/release/version.txt -Raw).Trim()
          if ('${{ github.ref_name }}' -cne "v$version") { throw 'Tag/version mismatch.' }
          ./tools/Validate-ReleaseArtifacts.ps1 -ProjectDir . -ReleaseDirectory ./artifacts/release -Version $version
          ./tools/Validate-CommercialRelease.ps1 -ProjectDir . -ReleaseDirectory ./artifacts/release -Version $version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create draft, upload every asset, then publish
        id: publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.OMNIGHOST_RELEASE_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'OMNIGHOST_RELEASE_TOKEN is required for the separate release repository.'
          }
          $tag = '${{ github.ref_name }}'
          $repo = $env:RELEASE_REPOSITORY
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists in $repo; refusing to treat a prior upload as validated by this workflow."
          }
          gh release create $tag --repo $repo --target $env:RELEASE_TARGET_BRANCH --draft --title "OmniGhost $tag" `
            --notes-file artifacts/release/release-notes.md `
            artifacts/release/OmniGhost.zip `
            artifacts/release/update.json `
            artifacts/release/update.json.sig `
            artifacts/release/install-manifest.sha256 `
            artifacts/release/SBOM.cdx.json `
            artifacts/release/changelog.json `
            artifacts/release/release-meta.json
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the complete draft release.' }
          $view = gh release view $tag --repo $repo --json isDraft,assets | ConvertFrom-Json
          $expected = @('OmniGhost.zip','update.json','update.json.sig','install-manifest.sha256','SBOM.cdx.json','changelog.json','release-meta.json')
          $actual = @($view.assets | ForEach-Object name)
          foreach ($asset in $expected) {
            if ($asset -notin $actual) { throw "Draft release is incomplete: $asset missing." }
          }
          gh release edit $tag --repo $repo --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Assets were uploaded, but the draft could not be published.' }
          "published=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
