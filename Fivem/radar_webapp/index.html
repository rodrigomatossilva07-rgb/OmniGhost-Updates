<!DOCTYPE html>
<html lang="pt">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>OmniGhost · FiveM Web Radar</title>
	<link rel="stylesheet" href="/css/main.css">
	<link rel="stylesheet" href="/css/map.css">
	<link rel="stylesheet" href="/css/custom.css">
	<link rel="icon" href="/img/icon-64x64.png">
</head>
<body data-theme="omnighost-dark">
	<div id="offline-banner" class="offline-banner" hidden>
		<strong>DMA / ligação offline</strong> — à espera de dados do OmniGhost…
	</div>

	<header id="topbar" class="topbar">
		<div class="brand">OmniGhost <span>FiveM Radar</span></div>
		<div id="conn-status" class="conn-status conn-status--error">Offline</div>
		<div class="topbar-actions">
			<button type="button" id="minimap-toggle" title="Mini-mapa (M)">Mini</button>
			<button type="button" id="operator-toggle" title="Operator mode">Operator</button>
			<button type="button" id="settings-toggle" title="Settings">⚙</button>
		</div>
	</header>

	<aside id="player-list" class="player-panel player-panel-right">
		<div class="player-panel-header">
			<h3>Jogadores (<span id="player-count">0</span>)</h3>
			<div class="player-panel-controls">
				<input type="text" id="player-search" placeholder="Pesquisar (/ ou Ctrl+F)">
				<select id="player-sort">
					<option value="distance">Distância</option>
					<option value="name">Nome</option>
					<option value="health">Vida</option>
				</select>
			</div>
		</div>
		<div id="player-table-container">
			<table id="player-table">
				<thead>
					<tr>
						<th>Nome</th><th>Dist.</th><th>HP</th><th>Colete</th><th>Veículo</th><th>Dir.</th>
					</tr>
				</thead>
				<tbody id="player-tbody"></tbody>
			</table>
		</div>
		<div class="player-panel-header objects-header">
			<h3>Objetos (<span id="object-count">0</span>)</h3>
			<input type="text" id="object-search" placeholder="Pesquisar objetos…">
		</div>
		<div id="object-table-container">
			<table id="object-table">
				<thead><tr><th>Nome</th><th>Cat.</th><th>Dist.</th></tr></thead>
				<tbody id="object-tbody"></tbody>
			</table>
		</div>
	</aside>

	<div id="settings-panel" class="settings-panel" hidden>
		<h3>Definições</h3>
		<label><input type="checkbox" id="set-names" checked> Nomes</label>
		<label><input type="checkbox" id="set-trails" checked> Trails</label>
		<label><input type="checkbox" id="set-cone" checked> Cone de look</label>
		<label><input type="checkbox" id="set-objects" checked> Objetos no mapa</label>
		<label><input type="checkbox" id="set-heatmap"> Heatmap sessão</label>
		<label><input type="checkbox" id="set-rotate"> Rodar com local</label>
		<p class="hint">Duplo-clique na lista: pin (máx 3) + seguir. Teclas: M mini · R rotação · Esc limpar</p>
	</div>

	<div id="container">
		<div id="radar">
			<img id="radarBackground" class="map-layer map-visible" src="/img/maps/gta5_map.webp" alt="Mapa GTA V" draggable="false">
			<img id="radarCayo" class="map-layer" src="/img/maps/cayo_perico.webp" alt="Cayo Perico" hidden draggable="false">
			<canvas id="radar-canvas" class="radar-canvas"></canvas>
		</div>
		<div id="unknownMap" hidden>
			<span>Sem dados de mapa / DMA offline</span>
		</div>
	</div>

	<script src="/js/i18n.js"></script>
	<script src="/js/map.js"></script>
	<script src="/js/main.js"></script>
	<script src="/js/playerList.js"></script>
	<script src="/js/settings.js"></script>
	<script>
		document.addEventListener('DOMContentLoaded', () => {
			const bind = (id, key, def) => {
				const el = document.getElementById(id);
				if (!el || !window.RadarApp) return;
				el.checked = RadarApp.state.settings[key] !== undefined ? !!RadarApp.state.settings[key] : def;
				el.addEventListener('change', () => {
					RadarApp.state.settings[key] = el.checked;
					if (key === 'followRotation') RadarApp.state.followRotation = el.checked;
					RadarApp.saveSettings();
				});
			};
			bind('set-names', 'showNames', true);
			bind('set-trails', 'showTrails', true);
			bind('set-cone', 'showLookCone', true);
			bind('set-objects', 'showObjects', true);
			bind('set-heatmap', 'heatmap', false);
			bind('set-rotate', 'followRotation', false);
		});
	</script>
</body>
</html>
