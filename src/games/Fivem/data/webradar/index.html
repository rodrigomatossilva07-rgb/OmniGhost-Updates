<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OmniGhost · FiveM Radar</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin><link rel="stylesheet" href="/styles.css"></head>
<body><div id="app">
  <header><div class="brand"><span class="logo">◈</span><div><b>OMNIGHOST</b><small>FIVEM WEB RADAR</small></div></div><div class="summary"><span id="status" class="status connecting">A ligar</span><span><b id="playerCount">0</b> jogadores</span><select id="layer"><option value="Atlas">Atlas</option><option value="Satellite">Satellite</option><option value="Roadmap">Roadmap</option></select><button id="settingsButton" title="Definições">⚙</button></div></header>
  <aside id="sidebar"><div class="aside-head"><input id="search" placeholder="Pesquisar jogador"><button id="compactButton">‹</button></div><div class="filters"><label><input id="showPlayers" type="checkbox" checked> Jogadores</label><label><input id="showVehicles" type="checkbox" checked> Veículos</label><label><input id="showNames" type="checkbox" checked> Nomes</label><label><input id="showDirections" type="checkbox" checked> Direções</label><label><input id="follow" type="checkbox" checked> Seguir seleção</label><label><input id="heatEnabled" type="checkbox"> Heatmap</label></div><div id="playerList"></div></aside>
  <main><div id="map"></div><div id="stale" hidden>Ligação interrompida — posições ocultadas</div><section id="details" hidden></section></main>
  <section id="settings" hidden><div class="dialog"><button id="closeSettings">×</button><h2>Definições</h2><label>Tamanho dos marcadores <input id="markerSize" type="range" min="8" max="26" value="15"></label><label>Suavização <input id="smoothing" type="range" min="0" max="100" value="65"></label><label>Opacidade do heatmap <input id="heatOpacity" type="range" min="10" max="90" value="55"></label><label>Raio do heatmap <input id="heatRadius" type="range" min="10" max="80" value="36"></label><label>Histórico <select id="heatHistory"><option value="15">15 segundos</option><option value="30" selected>30 segundos</option><option value="60">60 segundos</option></select></label><button id="addMarker">Adicionar marcador no centro</button><button id="clearMarkers">Limpar marcadores pessoais</button><p class="hint">O token de acesso permanece no fragmento do endereço e nunca é enviado como parâmetro HTTP.</p></div></section>
</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script><script src="/app.js"></script></body></html>
